AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Foro Online (Agora) - Host EC2 con Docker + Nginx (proxy inverso) para el frontend Angular
  y los 3 microservicios Spring Boot, y bucket S3 privado para el wallet de Oracle.
  Administracion por AWS Systems Manager (sin SSH).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC que contiene la subred publica.
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Subred publica con ruta a un Internet Gateway.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: 3 JVM + Nginx + frontend. Se recomienda t3.medium (4 GB RAM).
  InstanceImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Ultima AMI de Amazon Linux 2023 x86_64.
  AllowedHttpCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$'
    Description: Rango IPv4 autorizado a acceder por HTTP.
  ExistingInstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Perfil de instancia existente (en AWS Academy es LabInstanceProfile).
  OracleWalletBucketName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    Description: Bucket existente para el wallet; dejar vacio para crear uno nuevo.

Conditions:
  CreateWalletBucket: !Equals [!Ref OracleWalletBucketName, '']

Resources:
  OracleWalletBucket:
    Type: AWS::S3::Bucket
    Condition: CreateWalletBucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: Application
          Value: foro-online

  OracleWalletBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateWalletBucket
    Properties:
      Bucket: !Ref OracleWalletBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt OracleWalletBucket.Arn
              - !Sub '${OracleWalletBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

  ForoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP publico para Foro Online; administracion por Systems Manager.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: HTTP publico (Nginx)
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedHttpCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-sg

  ForoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref InstanceImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref ExistingInstanceProfileName
      NetworkInterfaces:
        - SubnetId: !Ref PublicSubnetId
          DeviceIndex: '0'
          AssociatePublicIpAddress: true
          DeleteOnTermination: true
          GroupSet:
            - !Ref ForoSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 2
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          dnf install -y docker nginx unzip jq
          systemctl enable --now docker
          systemctl enable --now amazon-ssm-agent

          # Memoria de intercambio (3 JVM en una instancia de 4 GB)
          if [ ! -f /swapfile ]; then
            dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap defaults 0 0' >> /etc/fstab
          fi

          mkdir -p /opt/foro/wallet
          chmod 700 /opt/foro/wallet

          rm -f /etc/nginx/conf.d/default.conf
          cat > /etc/nginx/conf.d/foro-online.conf <<'NGINX'
          # Proxy inverso: una sola URL publica para el frontend y los 3 microservicios
          upstream usuarios       { server 127.0.0.1:8081; }
          upstream administracion { server 127.0.0.1:8082; }
          upstream foro           { server 127.0.0.1:8083; }
          upstream frontend       { server 127.0.0.1:4000; }

          server {
              listen 80 default_server;
              server_name _;
              client_max_body_size 2m;

              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              # usuarios-service (CRUD usuarios + login JWT)
              location /api/auth/        { proxy_pass http://usuarios; }
              location /api/usuarios     { proxy_pass http://usuarios; }

              # administracion-service (categorias + banear/reactivar)
              location /api/categorias   { proxy_pass http://administracion; }
              location /api/publicaciones { proxy_pass http://administracion; }
              location /api/comentarios  { proxy_pass http://administracion; }

              # foro-service (buscar, ver, publicar y comentar)
              location /api/foro/        { proxy_pass http://foro; }

              # Frontend Angular
              location / { proxy_pass http://frontend; }
          }
          NGINX
          nginx -t
          systemctl enable --now nginx
          systemctl reload nginx
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}
        - Key: Application
          Value: foro-online
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  InstanceId:
    Description: Configurar como variable de Actions EC2_INSTANCE_ID en los 4 repositorios.
    Value: !Ref ForoInstance
  PublicIp:
    Description: IP publica de la instancia (cambia si se detiene la instancia).
    Value: !GetAtt ForoInstance.PublicIp
  WebsiteUrl:
    Description: URL de la aplicacion.
    Value: !Sub http://${ForoInstance.PublicIp}/
  WalletBucketName:
    Description: Subir aqui el ZIP del wallet y configurar ORACLE_WALLET_S3_BUCKET con este valor.
    Value: !If [CreateWalletBucket, !Ref OracleWalletBucket, !Ref OracleWalletBucketName]
